<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Handleseddel">
<meta name="theme-color" content="#F4F5F2">
<link rel="manifest" id="manifest" href="manifest.webmanifest">
<script>
  // Fryser-skærm: brug et manifest der åbner i fuld skærm uden adresselinje, når appen installeres på tabletten
  try{ if(/[?&]skaerm=fryser/.test(location.search)||(localStorage.getItem("hs_skaerm")==="1"&&!/[?&]skaerm=fra/.test(location.search))) document.getElementById("manifest").href="fryser.webmanifest"; }catch(e){}
</script>
<link rel="apple-touch-icon" href="icon-180.png">
<title>Handleseddel</title>
<style>
:root{
  --bg:#F4F5F2; --card:#FFFFFF; --ink:#1B1F1D; --muted:#5A625E; --line:#C9CEC9; --soft:#E6E9E5;
  --accent:#23577A; --accent-soft:#E5EEF5; --danger:#A3311F; --frost:#E6F1F7; --frost-ink:#1E5874;
  --rema:#0B3E86; --netto:#8A6A00; --brugsen:#B3261E;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;font-size:16px}
button,input,select{font:inherit;color:inherit}
html,body,button,a,input,select,label{touch-action:manipulation}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
h1{margin:0;font-size:28px;font-weight:700}
h2{margin:0;font-size:17px;font-weight:650}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-top:12px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;font-size:20px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
input[type=text],input[type=search],input[type=number],input[type=date],select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;font-size:16px}
.row{display:flex;gap:8px;align-items:center}
.row > .grow{flex:1;min-width:0}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;padding:0 16px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{min-height:38px;font-size:14px;padding:0 12px}
.btn.danger{color:var(--danger);border-color:#E3B9B1}
.btn.link{border:none;background:none;color:var(--accent);padding:0 6px}
#syncBar{font-size:13px;padding:8px 12px;border-radius:10px;margin-top:4px;cursor:pointer}
#syncBar.ok{background:transparent;color:var(--muted);padding:2px 0}
#syncBar.busy{background:var(--soft);color:var(--muted)}
#syncBar.offline{background:#FFF3E6;color:#6B3A10}
#syncBar.login,#syncBar.error{background:#FDECEA;color:var(--danger)}

/* Seddel */
.add{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0 4px;margin:0}
.vare{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--soft)}
.vare:first-child{border-top:none}
.tjek{flex:0 0 auto;width:30px;height:30px;border-radius:15px;border:2px solid var(--line);background:#fff;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
.vare.taget .tjek{background:var(--accent);border-color:var(--accent)}
.vare.taget .navn{text-decoration:line-through;color:var(--muted)}
.vare .indhold{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.vare .navn{font-size:17px;font-weight:550;overflow-wrap:anywhere;cursor:pointer;padding-top:3px}
.info{display:flex;flex-wrap:wrap;gap:6px}
.pille{font-size:13px;font-weight:600;border-radius:14px;padding:5px 10px;border:1px solid transparent;cursor:pointer;background:var(--soft);color:var(--ink);white-space:nowrap}
.pille.frys{background:var(--frost);color:var(--frost-ink)}
.pille.b-rema{background:#E7EEF8;color:var(--rema)}
.pille.b-netto{background:#FFF6CC;color:var(--netto)}
.pille.b-brugsen{background:#FBE9E7;color:var(--brugsen)}
.vthumb{width:52px;height:52px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--soft);flex:0 0 auto;cursor:pointer}
.pille.ofte{background:#fff;border-color:var(--line);font-weight:550}
.pille.b-anden{background:#EEE8F6;color:#5B3E8A}
.c-anden{color:#5B3E8A}
.egen{font-size:11px;font-weight:700;background:#FFF1C2;color:#6B5200;border-radius:8px;padding:2px 7px;margin-left:6px;text-transform:none;letter-spacing:0}
.sekhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tom{padding:20px 4px;text-align:center;color:var(--muted)}

/* Fryser */
.skuffe h2{display:flex;align-items:center;gap:8px}
.skuffe h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--frost-ink)}
.fvare{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--soft)}
.sekhead + .fvare{border-top:none}
.fvare .navn{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.fvare .antal{min-width:58px;text-align:center;font-weight:700;font-size:15px}
.rund{width:42px;height:42px;border-radius:21px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:600;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.rund.plus{background:var(--frost);border-color:#C7DEEA;color:var(--frost-ink)}
.nyfrys{display:flex;gap:8px;margin-top:8px}
.nyfrys{flex-wrap:wrap}
.nyfrys input[name=navn]{flex:1 1 100%}
.nyfrys input[type=number]{width:84px;flex:0 0 auto;text-align:center}
.nyfrys select{width:auto;flex:1 1 110px}

/* Faner i bunden */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:rgba(244,245,242,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--soft)}
nav.tabs button{flex:1;max-width:260px;min-height:52px;border:none;border-radius:14px;background:transparent;font-weight:650;font-size:16px;cursor:pointer;color:var(--muted)}
nav.tabs button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
nav.tabs .tal{display:inline-block;min-width:22px;padding:1px 6px;margin-left:6px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px}

/* Ark nedefra */
.skygge{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:20}
.ark{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
.ark .greb{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.ark h2{font-size:20px;margin-bottom:8px}
.ark .felt{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:14px;color:var(--muted);font-weight:500}
.ark .knapper{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.ark .knapper .btn{flex:1}
.tilbud{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin-top:8px}
.tilbud img{width:64px;height:64px;object-fit:contain;flex:0 0 auto;border-radius:8px;background:#fff}
.tilbud .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tilbud .t b{font-size:15px;overflow-wrap:anywhere}
.tilbud .pris{font-size:18px;font-weight:750;white-space:nowrap}
.tilbud .butik{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.c-rema{color:var(--rema)} .c-netto{color:var(--netto)} .c-brugsen{color:var(--brugsen)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--soft);font-size:16px;color:var(--ink)}
.toggle:first-child{border-top:none}
.toggle input{width:24px;height:24px}
#toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:15px;display:flex;gap:12px;align-items:center;max-width:92vw;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#toast span{flex:1;min-width:0}
#opdBanner{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:40;background:#1F7A3A;color:#fff;border:none;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;max-width:92vw}
body.skaerm #opdBanner{font-size:20px;padding:18px 24px}
#toast button{white-space:nowrap;flex:0 0 auto;background:none;border:none;color:#9FD0F0;font-weight:700;font-size:15px;cursor:pointer;padding:4px}

/* Fryser-skærm: tablet ved fryseren */
body.skaerm .wrap{max-width:1280px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
body.skaerm nav.tabs{display:none}
body.skaerm h1{font-size:34px}
body.skaerm #skuffer{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;align-items:start}
body.skaerm #skuffer .card{margin-top:0}
body.skaerm .fvare{padding:10px 0}
body.skaerm .fvare .navn{font-size:19px}
body.skaerm .fvare .antal{font-size:18px;min-width:72px}
body.skaerm .rund{width:58px;height:58px;border-radius:29px;font-size:28px}
body.skaerm .skuffe h2{font-size:21px}
body.skaerm #toast{bottom:calc(24px + env(safe-area-inset-bottom));font-size:18px;padding:16px 18px}
body.skaerm #toast button{font-size:18px}
body.skaerm #scanBtn{display:none}
#skaermTop{display:none}
body.skaerm #skaermTop{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 14px}
#skaermTop form{display:flex;gap:8px}
#skaermTop .ur{font-size:15px;color:var(--muted);align-self:center;text-align:right}
@media (max-width:700px){ body.skaerm #skaermTop{grid-template-columns:1fr} }
body.skaerm .hjul{overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%)}
body.skaerm .hjul::-webkit-scrollbar{display:none}
body.skaerm .hjul .fvare{scroll-snap-align:start}
body.skaerm .hjul.loop .fvare{border-top:1px solid var(--soft)}
body.skaerm .hjul .omgang{height:6px;background:#000;border-radius:3px;margin:6px 0}
body.skaerm .hjul .omgang + .fvare{border-top:none}
#scanVideo{width:100%;max-height:52vh;background:#000;border-radius:14px;object-fit:cover}
.scanramme{position:relative}
.scanramme::after{content:"";position:absolute;left:12%;right:12%;top:42%;height:16%;border:3px solid rgba(255,255,255,.85);border-radius:10px;pointer-events:none}
.vareinfo{display:flex;gap:12px;align-items:center}
.vareinfo img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:10px;flex:0 0 auto}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="titel">Handleseddel</h1>
    <button class="iconbtn" id="indstBtn" aria-label="Indstillinger">⚙︎</button>
  </header>
  <div id="syncBar" class="busy hidden"></div>

  <!-- SEDDEL -->
  <section id="v-seddel">
    <form class="add" id="addForm" autocomplete="off">
      <div class="row">
        <input class="grow" type="text" id="addInput" placeholder="Tilføj vare …" list="forslag" enterkeyhint="done">
        <button class="btn primary" type="submit">Tilføj</button>
      </div>
      <datalist id="forslag"></datalist>
      <datalist id="mineForslag"></datalist>
      <div class="info" id="ofte" style="margin-top:8px"></div>
    </form>
    <div class="card" id="seddelKort"><div id="seddelListe"></div></div>
    <div class="knapper" style="display:flex;margin-top:12px"><button class="btn" id="kopierBtn" style="flex:1">📋 Kopiér handleseddel</button></div>
    <div class="card hidden" id="kurvKort">
      <div class="sekhead"><h2 id="kurvTitel">I kurven</h2><button class="btn small" id="rydBtn">Ryd</button></div>
      <div id="kurvListe"></div>
    </div>
    <div class="knapper" style="display:flex;margin-top:8px"><button class="btn" id="mineBtn" style="flex:1">★ Mine tilbud</button></div>
    <p class="muted" id="tilbudInfo" style="padding:4px 4px 0"></p>
  </section>

  <!-- FRYSER -->
  <section id="v-fryser" class="hidden">
    <div id="skaermTop">
      <form id="mangelForm" autocomplete="off"><input type="text" id="mangelInput" placeholder="Mangler noget? Skriv det på sedlen …" list="forslag" style="flex:1"><button class="btn primary">På sedlen</button></form>
      <div class="ur" id="skaermInfo"></div>
    </div>
    <div class="add"><div class="row"><input class="grow" type="search" id="frysSoeg" placeholder="Søg i fryseren …"><button class="btn primary" id="scanBtn" aria-label="Scan stregkode">📷 Scan</button></div></div>
    <div id="skuffer"></div>
    <div class="card hidden" id="fjernetKort">
      <div class="sekhead"><h2>Taget ud for nylig</h2><button class="btn small" id="fjernetBtn">Vis</button></div>
      <p class="muted" style="margin:6px 0 0">Har du taget noget ud ved en fejl, kan du lægge det tilbage her.</p>
      <div id="fjernetListe" class="hidden"></div>
    </div>
    <div class="card hidden" id="importKort">
      <h2>Fryseren er tom</h2>
      <p class="muted">Hent varerne fra dine fryserlister i Home Assistant, eller opret skuffer under ⚙︎.</p>
      <button class="btn primary" id="importBtn">Hent fra Home Assistant</button>
    </div>
  </section>
</div>

<nav class="tabs">
  <button id="tab-seddel" aria-pressed="true">Seddel<span class="tal hidden" id="talSeddel"></span></button>
  <button id="tab-fryser" aria-pressed="false">Fryser<span class="tal hidden" id="talFryser"></span></button>
</nav>

<div id="arkLag" class="hidden"><div class="skygge" id="skygge"></div><div class="ark" id="ark"></div></div>
<div id="toast" class="hidden"></div>
<button id="opdBanner" class="hidden">🔄 Der ligger en opdatering klar – tryk for at opdatere</button>

<script>
  // Går enhedens ur forkert (fx en gammel tablet), bruges Home Assistants ur i stedet.
  (function(){ const D=Date; let f=0; try{ f=+localStorage.getItem("hs_tid")||0; }catch(e){}
    class KD extends D{ constructor(...a){ if(a.length) super(...a); else super(D.now()+f); } static now(){ return D.now()+f; } }
    window.Date=KD;
    window.TZ="Europe/Copenhagen";
    window.saetServerTid=h=>{ const st=D.parse(h||""); if(!st) return; const ny=st-D.now(); const nf=Math.abs(ny)>90000?ny:0;
      if(Math.abs(nf-f)>30000){ f=nf; try{ localStorage.setItem("hs_tid",String(f)); }catch(e){} } };
  })();

(function(){
  "use strict";
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const newId=p=>p+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
  const BUTIKKER={rema:"Rema 1000",netto:"Netto",brugsen:"Brugsen"};
  // Kun administratorer må oprette/rette "Mine tilbud" – alle kan se dem
  let ADMIN=localStorage.getItem("hs_admin")!=="0";
  async function hentMig(){ if(!HA) return; try{ const j=await api("mig"); ADMIN=!!j.admin; try{ localStorage.setItem("hs_admin",ADMIN?"1":"0"); }catch(e){} render(); }catch(e){} }
  const butikNavn=t=>BUTIKKER[t.butik]||t.butikNavn||"Anden butik";
  const tal=n=>{ const v=Math.round((+n||0)*100)/100; return String(v).replace(".",","); };
  const kr=n=>n==null?"":(Math.round(n*100)%100? (n.toFixed(2).replace(".",",")) : String(Math.round(n)))+" kr";

  // ---------- lager på enheden + synkronisering med Home Assistant ----------
  const HA = location.pathname.startsWith("/handle-app/");
  const DATAKEY="hs_data_v1";
  let db={records:{},dirty:[]};
  try{ const o=JSON.parse(localStorage.getItem(DATAKEY)||"null"); if(o&&o.records) db={records:o.records,dirty:Array.isArray(o.dirty)?o.dirty:[]}; }catch(e){}
  function persist(){ try{ localStorage.setItem(DATAKEY,JSON.stringify(db)); }catch(e){ toast("Telefonen kunne ikke gemme"); } }
  const alle=kind=>Object.values(db.records).filter(r=>r&&!r.deleted&&r.kind===kind);
  function put(r){ const prev=db.records[r.id]; r.updated=Math.max(Date.now(),prev?(prev.updated||0)+1:0); db.records[r.id]=r; if(!db.dirty.includes(r.id)) db.dirty.push(r.id); persist(); render(); planSync(800); }
  function del(id){ const prev=db.records[id]; if(!prev) return;
    // Fryservarer gemmes med navn og antal, så de kan lægges tilbage, hvis det var en fejl.
    if(prev.kind==="frys") put(Object.assign({},prev,{deleted:true,slettet:Date.now()}));
    else put({id,kind:prev.kind,deleted:true}); }
  const get=id=>{ const r=db.records[id]; return r&&!r.deleted?Object.assign({},r):null; };

  // --- login (samme metode som de andre apps) ---
  let inFrame=false; try{ inFrame=window.self!==window.top; }catch(e){ inFrame=true; }
  const APP_BASE=location.origin+"/handle-app/";
  const CLIENT_ID=APP_BASE, REDIRECT_URI=APP_BASE+"index.html";
  const authGet=()=>{ try{ return JSON.parse(localStorage.getItem("hs_auth")||"null"); }catch(e){ return null; } };
  const authSet=a=>{ try{ a?localStorage.setItem("hs_auth",JSON.stringify(a)):localStorage.removeItem("hs_auth"); }catch(e){} };
  async function tokenRequest(params){
    const r=await fetch("/auth/token",{method:"POST",body:new URLSearchParams(params)});
    if(!r.ok){ const e=new Error("auth "+r.status); e.status=r.status; throw e; }
    const j=await r.json();
    return {access_token:j.access_token,refresh_token:j.refresh_token||params.refresh_token,expires:Date.now()+(j.expires_in||1800)*1000,clientId:params.client_id};
  }
  async function parentToken(){
    try{ if(!inFrame) return null; const ha=window.parent.document.querySelector("home-assistant"); const a=ha&&ha.hass&&ha.hass.auth; if(!a) return null; if(a.expired) await a.refreshAccessToken(); return a.accessToken||null; }catch(e){ return null; }
  }
  async function getToken(force){
    const pt=await parentToken(); if(pt) return pt;
    let a=authGet();
    if(!a){ try{ const h=JSON.parse(localStorage.getItem("hassTokens")||"null"); if(h&&h.refresh_token&&h.clientId) a={access_token:h.access_token,refresh_token:h.refresh_token,expires:h.expires||0,clientId:h.clientId,borrowed:true}; }catch(e){} }
    if(!a) return null;
    if(!force&&a.access_token&&a.expires>Date.now()+30000) return a.access_token;
    try{ const n=await tokenRequest({grant_type:"refresh_token",refresh_token:a.refresh_token,client_id:a.clientId}); if(!a.borrowed) authSet(n); return n.access_token; }
    catch(e){ if(e.status===400||e.status===403){ if(!a.borrowed) authSet(null); return null; } throw e; }
  }
  function startLogin(){
    const st=newId("s"); try{ localStorage.setItem("hs_state",st); }catch(e){}
    location.href="/auth/authorize?response_type=code&client_id="+encodeURIComponent(CLIENT_ID)+"&redirect_uri="+encodeURIComponent(REDIRECT_URI)+"&state="+encodeURIComponent(st);
  }
  async function handleLoginReturn(){
    if(!HA) return;
    const q=new URLSearchParams(location.search); const code=q.get("code"); if(!code) return;
    history.replaceState(null,"",location.pathname+location.hash);
    let expected=null; try{ expected=localStorage.getItem("hs_state"); localStorage.removeItem("hs_state"); }catch(e){}
    if(expected&&q.get("state")!==expected){ toast("Login mislykkedes – prøv igen"); return; }
    try{ authSet(await tokenRequest({grant_type:"authorization_code",code,client_id:CLIENT_ID})); toast("Logget ind"); }catch(e){ toast("Login mislykkedes – prøv igen"); }
  }
  async function api(path,opts={},retried){
    const t=await getToken(retried);
    if(!t){ const e=new Error("login"); e.login=true; throw e; }
    const r=await fetch(path.startsWith("/")?path:"/api/handleseddel/"+path,Object.assign({},opts,{headers:Object.assign({},opts.headers||{},{Authorization:"Bearer "+t})}));
    try{ saetServerTid(r.headers.get("Date")); }catch(e){}
    if(r.status===401&&!retried) return api(path,opts,true);
    if(r.status===401){ authSet(null); const e=new Error("login"); e.login=true; throw e; }
    if(!r.ok){ const e=new Error("server "+r.status); throw e; }
    return r.json();
  }

  // --- synkronisering ---
  let syncState={status:HA?"busy":"off",last:+(localStorage.getItem("hs_lastSync")||0)};
  let syncing=false, igen=false, syncTimer=null;
  function drawSync(){
    const b=$("syncBar"); if(!HA){ b.classList.add("hidden"); return; }
    const n=db.dirty.length;
    const t=syncState.last?new Date(syncState.last).toLocaleTimeString("da-DK",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}):"";
    let cls="ok",txt="Delt med alle enheder · "+t;
    if(syncState.status==="busy"){ cls="busy"; txt="Synkroniserer …"; }
    else if(syncState.status==="login"){ cls="login"; txt="Ikke logget ind – tryk her for at logge ind"; }
    else if(syncState.status==="offline"){ cls="offline"; txt="Ingen forbindelse – gemmes på telefonen"+(n?" ("+n+" venter)":""); }
    else if(syncState.status==="error"){ cls="error"; txt="Kunne ikke synkronisere – tryk for at prøve igen"; }
    else if(n){ cls="busy"; txt=n+" ændring(er) sendes …"; }
    b.className=cls; b.textContent=txt;
  }
  async function sync(){
    if(!HA) return;
    if(syncing){ igen=true; return; }
    syncing=true; if(syncState.status!=="ok") { syncState.status="busy"; drawSync(); }
    try{
      const poster=db.dirty.map(id=>db.records[id]).filter(Boolean);
      const sendt={}; poster.forEach(p=>{ sendt[p.id]=p.updated||0; });
      const j=await api("sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({poster})});
      flet(j.poster);
      // behold kun ændringer, der er lavet mens vi ventede på svar
      db.dirty=db.dirty.filter(id=>!(id in sendt)||((db.records[id]||{}).updated||0)>sendt[id]);
      persist();
      syncState={status:"ok",last:Date.now()}; try{ localStorage.setItem("hs_lastSync",String(syncState.last)); }catch(e){}
    }catch(e){
      syncState.status=e.login?"login":(navigator.onLine===false||e instanceof TypeError?"offline":"error");
    }finally{
      syncing=false; render();
      if(igen){ igen=false; planSync(300); }
    }
  }
  function flet(liste){
    if(!Array.isArray(liste)) return;
    for(const r of liste){ if(!r||!r.id) continue; const cur=db.records[r.id];
      if(!cur||(r.updated||0)>(cur.updated||0)||(!ADMIN&&(r.kind==="mittilbud"||(cur&&cur.kind==="mittilbud")))) db.records[r.id]=r; }
    if(!ADMIN){ const ids=new Set(liste.map(r=>r&&r.id)); for(const id of Object.keys(db.records)) if(db.records[id]&&db.records[id].kind==="mittilbud"&&!ids.has(id)) delete db.records[id]; }
  }
  function planSync(ms){ clearTimeout(syncTimer); syncTimer=setTimeout(sync,ms); }
  $("syncBar").onclick=()=>{ if(syncState.status==="login") startLogin(); else sync(); };
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ sync(); hentTilbud(); } });
  window.addEventListener("online",()=>sync());

  // ---------- tilbud ----------
  let tilbud=[]; let tilbudHentet=0; let tilbudFejl=[];
  try{ const t=JSON.parse(localStorage.getItem("hs_tilbud")||"null"); if(t){ tilbud=t.tilbud||[]; tilbudHentet=t.hentet||0; } }catch(e){}
  let tilbudSidst=0;
  async function hentTilbud(frisk){
    if(!HA) return;
    if(!frisk&&Date.now()-tilbudSidst<10*60*1000) return;
    tilbudSidst=Date.now();
    try{
      const j=await api("tilbud"+(frisk?"?frisk=1":""));
      tilbud=Array.isArray(j.tilbud)?j.tilbud:[]; tilbudHentet=(j.hentet||0)*1000; tilbudFejl=j.fejl||[];
      try{ localStorage.setItem("hs_tilbud",JSON.stringify({tilbud,hentet:tilbudHentet})); }catch(e){}
      matchCache.clear(); render();
      if(frisk) toast(tilbudFejl.length?"Kunne ikke hente fra "+tilbudFejl.join(", "):"Tilbud opdateret");
    }catch(e){ if(frisk) toast("Kunne ikke hente tilbud"); }
  }
  function indst(){ return get("indstillinger")||{id:"indstillinger",kind:"indst",butikker:{rema:true,netto:true,brugsen:true}}; }

  // Matcher en vare på sedlen med tilbud: alle ord i varen skal findes i tilbuddets overskrift.
  const STOP=new Set(["og","eller","med","til","af","i","på","ca","stk","stk.","kg","g","gr","l","ltr","pose","poser","pakke","pakker","x","fx","lidt","nogle","mere","ny","nye","god","gode","1/2","halv"]);
  const norm=s=>String(s||"").toLowerCase().replace(/[^a-zæøåéü0-9]+/g," ").trim();
  function ord(s){ return norm(s).split(" ").filter(w=>w&&!STOP.has(w)&&!/^\d+$/.test(w)); }
  function stamme(w){ return w.length>=6? w.replace(/(erne|ene|er|e|r)$/,""): w; }
  // Sammensatte ord, der er en anden vare: "kakaomælk" er ikke "mælk", "havregryn" er ikke "gryn".
  const ANDET=["kakao","cacao","choko","chokolade","jordbær","vanilje","kaffe","karamel","banan","protein","havre","soja","mandel","kokos","ris","kærne","kondens","frugt","smag","is","hindbær","blåbær","lakrids","mokka","latte","energi"];
  const EFTER=["snitte","chokolade","pulver","karamel","bolle","kage","kiks","slik","is","drik","creme","sauce"];
  function ordPasser(w,t){
    if(t.length<=3) return w===t;
    const st=stamme(t); const i=w.indexOf(st);
    if(i<0) return false;
    if(i>0){ const forled=w.slice(0,i); if(ANDET.some(a=>forled===a||forled.endsWith(a))) return false; }
    const efterled=w.slice(i+st.length).replace(/^(e|s|es)(?=..)/,"");
    if(efterled&&EFTER.some(e=>efterled===e||efterled.startsWith(e))) return false;
    return true;
  }
  function passer(tokens,tekst,udeluk){
    const ws=norm(tekst).split(" ");
    return tokens.every(t=>ws.some(w=>ordPasser(w,t)&&!(udeluk&&udeluk.has(w))));
  }
  // Tilbud brugeren har sagt "ikke den" til, pr. vare. Deles mellem alle enheder.
  function udelukFor(navn){ const r=get("udeluk"); const l=(r&&r.ord&&r.ord[norm(navn)])||[]; return new Set(l); }
  function udeluk(navn,t){
    const r=get("udeluk")||{id:"udeluk",kind:"udeluk",ord:{}}; r.ord=r.ord||{};
    const key=norm(navn); const l=new Set(r.ord[key]||[]);
    const tokens=ord(navn); const ws=norm(t.titel).split(" ");
    const sammensat=ws.filter(w=>tokens.some(tk=>ordPasser(w,tk)&&w!==tk));
    if(sammensat.length) sammensat.forEach(w=>l.add(w)); else l.add("#"+t.id);
    r.ord[key]=[...l]; put(r); matchCache.clear();
    return sammensat.length?sammensat.join(", "):t.titel;
  }
  const matchCache=new Map();
  function tilbudFor(navn){
    const key=norm(navn); if(matchCache.has(key)) return matchCache.get(key);
    const tokens=ord(navn); let res=[];
    if(tokens.length){
      const nu=Date.now(); const b=indst().butikker||{}; const ud=udelukFor(navn);
      res=tilbud.filter(t=>b[t.butik]!==false && !ud.has("#"+t.id) && (!t.til||Date.parse(t.til.replace(/\+0000$/,"Z"))>nu) &&
        (passer(tokens,t.titel,ud) || (tokens.length===1&&tokens[0].length>=5&&passer(tokens,t.tekst,ud))));
      // egne (personlige) tilbud, fx fra Netto+
      for(const m of mineTilbud()) if(!ud.has("#"+m.id)&&(passer(tokens,m.titel,ud)||(m.kort&&passer(tokens,m.kort,ud)))) res.push(m);
      res.sort((a,b)=>(a.pris??1e9)-(b.pris??1e9));
    }
    matchCache.set(key,res); return res;
  }
  function frysFor(navn){
    const tokens=ord(navn); if(!tokens.length) return [];
    return alle("frys").filter(f=>(f.antal||0)>0&&passer(tokens,f.navn));
  }
  const dato=s=>{ if(!s) return null; const d=new Date(s.replace(/\+0000$/,"Z")); return isNaN(d)?null:d; };
  const dagNavn=d=>d.toLocaleDateString("da-DK",{timeZone:TZ,weekday:"short",day:"numeric",month:"numeric"});
  function periode(t){
    const fra=dato(t.fra), til=dato(t.til), nu=new Date();

  // ---------- visning ----------

  function renderSeddel(){

    { const n=mineTilbud().length; $("mineBtn").textContent="★ Mine tilbud"+(n?" ("+n+")":""); }
    const varer=alle("vare");

    $("tilbudInfo").textContent=HA?(tilbudHentet?"Tilbud fra "+valgte.join(", ")+" · hentet "+new Date(tilbudHentet).toLocaleString("da-DK",{timeZone:TZ,weekday:"short",hour:"2-digit",minute:"2-digit"}):"Henter tilbud …"):"";
  }
  function vareHtml(v){
    let info="";
    if(!v.taget){
      const fr=frysFor(v.navn);
      if(fr.length){ const f=fr[0]; const sk=get(f.skuffe); info+='<span class="pille frys" data-frys="'+esc(v.id)+'">❄︎ Har '+esc(fAntal(f))+(fr.length>1?" +"+(fr.length-1):"")+(sk?" · "+esc(sk.navn):"")+'</span>'; }
      const tb=tilbudFor(v.navn); const set=new Set();
      // én pille pr. butik; et eget tilbud går forrest hvis det er billigst
      for(const t of tb){ if(set.has(t.butik)) continue; set.add(t.butik);
        info+='<span class="pille b-'+(BUTIKKER[t.butik]?t.butik:"anden")+'" data-tilbud="'+esc(v.id)+'">'+(t.egen?"★ ":"")+esc(butikNavn(t))+" "+esc(kr(t.pris))+'</span>'; }

  }
  const ENHEDER=["stk","pose","pakke","bakke","boks","æske","portion","kg","g","liter","dl","rulle","glas"];
  function flertal(e,n){ e=e||"stk"; if(e==="stk") return "stk."; if(n===1) return e; return ({pose:"poser",pakke:"pakker",bakke:"bakker",boks:"bokse","æske":"æsker",portion:"portioner",rulle:"ruller"})[e]||e; }
  function trin(e){ return e==="g"?100:(e==="kg"||e==="liter")?0.5:1; }
  const enhedValg=v=>ENHEDER.map(e=>'<option value="'+e+'"'+(e===(v||"stk")?" selected":"")+'>'+flertal(e,2)+'</option>').join("");
  // Står varen allerede på sedlen (fx "Kaffe" når tilbuddet hedder "Gevalia Mellemristet kaffe 400 g")?
  function paaSedlen(navn,kort){
    return alle("vare").some(v=>{ if(v.taget) return false; const n=norm(v.navn);
      if(n===norm(navn)||(kort&&n===norm(kort))) return true;
      const tk=ord(v.navn); return tk.length>0&&passer(tk,navn); }); }
  function billedeFor(v){ if(v.taget) return ""; const t=tilbudFor(v.navn).find(x=>x.egen&&x.billede); return t?t.billede:""; }
  function fAntal(f){ if((!f.enhed||f.enhed==="stk")&&f.antal===1&&/\d/.test(f.navn)) return f.navn; return tal(f.antal)+" "+flertal(f.enhed,f.antal)+" "+f.navn; }

  $("addForm").onsubmit=e=>{ e.preventDefault(); const n=$("addInput").value.trim(); if(!n) return; tilfoejVare(n); $("addInput").value=""; };
  function tilfoejVare(n){
    const findes=alle("vare").find(v=>!v.taget&&norm(v.navn)===norm(n));
    if(findes){ toast(n+" står allerede på sedlen"); return; }
    const gl=alle("vare").find(v=>v.taget&&norm(v.navn)===norm(n));
    if(gl){ gl.taget=false; gl.oprettet=Date.now(); put(gl); return; }

  document.addEventListener("click",e=>{

  });
  $("rydBtn").onclick=()=>{ const t=alle("vare").filter(v=>v.taget); t.forEach(v=>{ husk(v.navn,false); del(v.id); }); toast("Kurven er ryddet",()=>{ t.forEach(v=>{ v.taget=true; put(v); }); }); };
  // Husker varer og hvor tit de bliver købt, så de oftest købte kan tilføjes med ét tryk.
  function husk(navn,koebt){ const id="h-"+norm(navn).replace(/ /g,"_").slice(0,100); if(id.length<4) return;
    const h=get(id)||{id,kind:"historik",navn,n:0}; if(koebt){ h.n=(h.n||0)+1; h.sidst=Date.now(); h.navn=navn; put(h); } else if(!get(id)) put(h); }
  function renderOfte(){

    const l=alle("historik").filter(h=>(h.n||0)>0&&!paa.has(norm(h.navn)))

  // Fælles hukommelse for alle enheder: sidste enhed/antal pr. fryservare og sidste værdier pr. eget tilbud.
  function laering(){ return get("laering")||{id:"laering",kind:"laering",frys:{},tilbud:{}}; }
  function laer(del2,navn,val){ const r=laering(); r[del2]=r[del2]||{}; r[del2][norm(navn)]=Object.assign({},val,{navn,t:Date.now()});
    const keys=Object.keys(r[del2]); if(keys.length>400){ keys.sort((a,b)=>r[del2][a].t-r[del2][b].t).slice(0,keys.length-400).forEach(k=>delete r[del2][k]); }
    put(r); }

  // ---------- fryser ----------
  function skuffer(){ return alle("skuffe").sort((a,b)=>(a.orden||0)-(b.orden||0)); }
  let aabenNy=null;
  let sidsteFrysHtml="";
  // Kraftig sort linje mellem hver omgang på hjulet, så man kan se, at man er kørt hele vejen rundt
  const OMGANG='<div class="omgang" aria-hidden="true"></div>';
  function hjulHoejde(){
    document.querySelectorAll(".hjul").forEach(h=>{ const top=h.getBoundingClientRect().top+window.scrollY;
      h.style.height=Math.max(220,window.innerHeight-top-70)+"px"; });
  }
  function opsaetHjul(pos){
    hjulHoejde();
    document.querySelectorAll(".hjul").forEach(h=>{
      const loop=+h.dataset.n>3 && h.scrollHeight/3>h.clientHeight;
      const saet=h.scrollHeight/3;
      if(loop){ h.classList.add("loop"); h.scrollTop=saet+(pos&&pos[h.dataset.hjul]!=null?pos[h.dataset.hjul]:0); }
      h.onscroll=()=>{
        if(!loop){ h._offset=h.scrollTop; return; }
        const st=h.scrollHeight/3;
        if(h.scrollTop<st*0.5) h.scrollTop+=st; else if(h.scrollTop>st*1.5) h.scrollTop-=st;
        h._offset=h.scrollTop-st;
      };
      if(!loop&&pos&&pos[h.dataset.hjul]!=null) h.scrollTop=pos[h.dataset.hjul];
    });
  }
  window.addEventListener("resize",()=>{ if(document.body.classList.contains("skaerm")){ sidsteFrysHtml=""; renderFryser(); } });
  function renderFryser(){

        '<div class="navn" data-fret="'+esc(f.id)+'">'+esc(f.navn)+'</div><div class="antal">'+esc(tal(f.antal))+" "+esc(flertal(f.enhed,f.antal))+'</div>'+

        : '<div style="margin-top:6px"><button class="btn link" data-nyfrys="'+esc(s.id)+'">+ Læg vare i '+esc(s.navn.toLowerCase())+'</button></div>';

  }
  $("frysSoeg").oninput=renderFryser;
  function nyFrysForm(id){ aabenNy=id; renderFryser(); const f=document.querySelector('.nyfrys input[name=navn]'); if(f) f.focus(); }
  // Når en kendt vare skrives, foreslås samme enhed og antal som sidst
  document.addEventListener("input",e=>{
    const i=e.target; if(!(i.name==="navn"&&i.closest(".nyfrys"))) return;
    const f=i.closest(".nyfrys"); const x=(laering().frys||{})[norm(i.value)]
      || (()=>{ const g=alle("frys").concat(fjernede()).find(r=>norm(r.navn)===norm(i.value)); return g?{enhed:g.enhed||"stk",antal:1}:null; })();

  // Varer, der blev taget ud før "fortryd" fandtes, mangler navn. Navnet hentes fra Home Assistants fryserlister.
  async function hentNavneTilFjernede(){
    const mangler=Object.values(db.records).filter(r=>r&&r.kind==="frys"&&r.deleted&&!r.navn&&/^f-/.test(r.id));
    if(!mangler.length) return;
    try{
      const stater=await api("/api/states");
      const lister=stater.filter(x=>x.entity_id.startsWith("todo.")&&/fryser/i.test((x.attributes&&x.attributes.friendly_name)||""));
      let fundet=0;
      for(const l of lister){
        const svar=await api("/api/services/todo/get_items?return_response",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({entity_id:l.entity_id})});
        const items=((svar.service_response||{})[l.entity_id]||{}).items||[];
        const skId=("sk-"+l.entity_id.split(".")[1].replace(/[^A-Za-z0-9_.:-]/g,"")).slice(0,120);
        for(const it of items){
          const id=("f-"+String(it.uid||"").replace(/[^A-Za-z0-9_.:-]/g,"")).slice(0,120);
          const r=db.records[id]; if(!r||!r.deleted||r.navn) continue;
          const [navn,antal,enhed]=fortolk(it.summary);
          put({id,kind:"frys",navn,antal,enhed,skuffe:skId,deleted:true,slettet:r.updated||Date.now()}); fundet++;
        }
      }
    }catch(e){}
  }
  function fortolk(tekst){
    const s=String(tekst||"").split(/\s+/).join(" ").trim();
    const T={stk:"stk","stk.":"stk",pose:"pose",poser:"pose",pakke:"pakke",pakker:"pakke",bakke:"bakke",bakker:"bakke","æske":"æske","æsker":"æske",rulle:"rulle",ruller:"rulle"};
    let m=s.match(/^(.*?)\s+(?:ca\.?\s+)?(\d+(?:[.,]\d+)?)\s*([A-Za-zæøåÆØÅ.]+)?$/);
    if(m&&m[1]){ const e=(m[3]||"").toLowerCase(); if(T[e]) return [m[1].trim(),parseFloat(m[2].replace(",",".")),T[e]]; }
    m=s.match(/^(\d+)\s+([^\d/].*)$/);
    if(m){ const n=m[2].trim(); return [n.charAt(0).toUpperCase()+n.slice(1),parseFloat(m[1]),"stk"]; }
    return [s,1,"stk"];
  }

  // ---------- mine tilbud (personlige tilbud, fx Netto+) ----------
  function slutAfDag(d){ const x=new Date(d+"T23:59:59"); return isNaN(x)?null:x; }
  function mineTilbud(){
    const nu=Date.now();
    return alle("mittilbud").filter(m=>{ const t=slutAfDag(m.til); return !t||t.getTime()>=nu; })
      .map(m=>({id:m.id,egen:true,butik:m.butik,butikNavn:m.butikNavn,titel:m.navn,kort:m.kort||"",tekst:m.note||"",pris:m.pris,foer:null,
        fra:null,til:m.til?slutAfDag(m.til).toISOString():null,billede:m.billede||""}));
  }
  const isoDag=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  function naesteSoendag(){ const d=new Date(); d.setDate(d.getDate()+((7-d.getDay())%7||7)); return isoDag(d); }
  function dageTil(iso){ const t=new Date(iso+"T00:00:00"), n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/864e5); }
  function sluttekst(iso){ const n=dageTil(iso); return n<0?"udløbet":n===0?"slutter i dag":n===1?"slutter i morgen":"slutter om "+n+" dage ("+dagTekst(iso)+")"; }
  function dagTekst(iso){ const d=slutAfDag(iso); return d?d.toLocaleDateString("da-DK",{timeZone:TZ,weekday:"short",day:"numeric",month:"short"}):""; }
  function visMine(){
    const l=alle("mittilbud").sort((a,b)=>String(a.til||"").localeCompare(String(b.til||"")));
    const nu=Date.now();
    aabenArk('<h2>Mine tilbud</h2><p class="muted">Personlige tilbud, fx fra Netto+ i Netto-appen. De bliver markeret på sedlen som de andre tilbud og forsvinder, når de udløber.</p>'+

  // ---------- billede af tilbud → udfyld formularen (AI i Home Assistant) ----------
  let fotoBillede="", fotoKort="";
  function indlaesBillede(fil){ return new Promise((ok,fejl)=>{ const url=URL.createObjectURL(fil); const img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); ok(img); }; img.onerror=()=>{ URL.revokeObjectURL(url); fejl(new Error("billede")); }; img.src=url; }); }
  function tegn(img,sx,sy,sw,sh,maks,kval){ const sk=Math.min(1,maks/Math.max(sw,sh)); const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(sw*sk)); c.height=Math.max(1,Math.round(sh*sk)); const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
    g.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height); return c.toDataURL("image/jpeg",kval); }
  // AI'en giver boksen som andele (0–1), men nogle gange i promille (0–1000) eller i pixels – gør det til andele.
  function boks(b,img){
    if(!b) return null;
    let v=[b.boks_x1,b.boks_y1,b.boks_x2,b.boks_y2].map(x=>typeof x==="string"?parseFloat(x.replace(",",".")):x);
    if(!v.every(x=>typeof x==="number"&&isFinite(x)&&x>=0)) return null;
    const m=Math.max(...v);
    if(m>1.001){
      if(m<=1000) v=v.map(x=>x/1000);
      else { const sk=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)); const w=img.naturalWidth*sk, h=img.naturalHeight*sk; v=[v[0]/w,v[1]/h,v[2]/w,v[3]/h]; }
    }
    let [x1,y1,x2,y2]=v; if(x1>x2) [x1,x2]=[x2,x1]; if(y1>y2) [y1,y2]=[y2,y1];
    x1=Math.max(0,x1); y1=Math.max(0,y1); x2=Math.min(1,x2); y2=Math.min(1,y2);
    return (x2-x1>0.03&&y2-y1>0.03)?{x1,y1,x2,y2}:null;
  }
  function udsnit(img,b){
    const W=img.naturalWidth,H=img.naturalHeight;
    let x1=0,y1=0,x2=1,y2=1;
    const k=boks(b,img);
    if(k){
      const px=(k.x2-k.x1)*0.06, py=(k.y2-k.y1)*0.06;
      x1=Math.max(0,k.x1-px); y1=Math.max(0,k.y1-py); x2=Math.min(1,k.x2+px); y2=Math.min(1,k.y2+py); }
    let d="", maks=320, kval=0.75;
    for(let i=0;i<5;i++){ d=tegn(img,x1*W,y1*H,(x2-x1)*W,(y2-y1)*H,maks,kval); if(d.length<38000) break; maks=Math.round(maks*0.8); kval=Math.max(0.45,kval-0.08); }
    return d;
  }
  // Flere billeder på én gang: læses ét ad gangen, og alle tilbud oprettes direkte
  async function laesFotos(filer,f){
    if(filer.length===1){ await laesFoto(filer[0],f,false); return; }
    const st=$("fotoStatus"); let nye=0, fandtes=0, fejl=0;
    for(let i=0;i<filer.length;i++){
      st.textContent="Læser billede "+(i+1)+" af "+filer.length+" …";
      const r=await laesFoto(filer[i],f,true);
      if(!r){ fejl++; continue; } nye+=r.nye; fandtes+=r.fandtes;
    }
    fotoBillede=""; visMine();
    const tekst=nye+" tilbud oprettet fra "+filer.length+" billeder"+(fandtes?", "+fandtes+" fandtes i forvejen":"")+(fejl?", "+fejl+" billede(r) kunne ikke læses":"")+".";
    $("fotoStatus").textContent=tekst; toast(tekst);
  }
  async function laesFoto(fil,f,flere){
    const st=$("fotoStatus"); if(!flere) st.textContent="Læser tilbuddet …";
    let img; try{ img=await indlaesBillede(fil); }catch(e){ if(!flere) st.textContent="Kunne ikke åbne billedet."; return null; }
    if(!flere){ fotoBillede=udsnit(img,null); $("fotoImg").src=fotoBillede; $("fotoVis").classList.remove("hidden"); }
    const stort=tegn(img,0,0,img.naturalWidth,img.naturalHeight,1600,0.85);
    try{
      const j=await api("laes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({billede:stort})});
      const liste=Array.isArray(j.tilbud)?j.tilbud:(j.tilbud?[j.tilbud]:[]);
      if(!flere&&liste.length<=1){
        const t=liste[0]||{};
        if(t.fulde_navn||t.navn) f.navn.value=t.fulde_navn||t.navn; fotoKort=(t.fulde_navn&&t.navn)?t.navn:"";
        if(typeof t.pris==="number") f.pris.value=t.pris;
        if(t.butik&&[...f.butik.options].some(o=>o.value===t.butik)){ f.butik.value=t.butik; f.butikNavn.value=t.butik_navn||""; $("andenFelt").classList.toggle("hidden",t.butik!=="anden"); }
        if(t.slutdato&&/^\d{4}-\d{2}-\d{2}$/.test(t.slutdato)){ f.til.value=t.slutdato; f.dage.value=dageTil(t.slutdato); }
        const noter=[t.note,(t.foer_pris?"før "+kr(t.foer_pris):"")].filter(Boolean).join(" · "); if(noter) f.note.value=noter;
        fotoBillede=udsnit(img,t); $("fotoImg").src=fotoBillede;
        st.textContent=(t.fulde_navn?"Fundet: "+t.fulde_navn+". ":"")+"Tjek felterne og tryk Tilføj tilbud.";
        return;
      }
      // Flere tilbud på samme billede: opret alle, der ikke findes i forvejen
      const paaSeddel=f.paaSeddel.checked; let nye=0, fandtes=0;
      const aktive=mineTilbud();
      for(const t of liste){
        const navn=String(t.fulde_navn||t.navn||"").trim(); if(!navn) continue; const kort=(t.fulde_navn&&t.navn)?String(t.navn).trim():"";
        const butik=[...f.butik.options].some(o=>o.value===t.butik)?t.butik:"netto";
        const harBoks=!!boks(t,img);
        const gl=aktive.find(m=>m.butik===butik&&(norm(m.titel)===norm(navn)||(kort&&(norm(m.titel)===norm(kort)||norm(m.kort)===norm(kort)))));
        if(gl){ fandtes++; const r=get(gl.id); if(r&&(!r.billede||(harBoks&&r.helt))){ r.billede=udsnit(img,t); r.helt=!harBoks; put(r); } continue; }
        let til=(t.slutdato&&/^\d{4}-\d{2}-\d{2}$/.test(t.slutdato))?t.slutdato:null;
        if(!til){ const x=(laering().tilbud||{})[norm(navn)]; const d=new Date(); d.setDate(d.getDate()+((x&&x.dage>=0)?x.dage:7)); til=isoDag(d); }
        const note=[t.note,(t.foer_pris?"før "+kr(t.foer_pris):"")].filter(Boolean).join(" · ");
        const pris=typeof t.pris==="number"?t.pris:null;
        put({id:newId("mt"),kind:"mittilbud",navn,kort,butik,butikNavn:butik==="anden"?(t.butik_navn||"Anden butik"):"",pris,til,note,billede:udsnit(img,t),helt:!harBoks});
        laer("tilbud",navn,{butik,butikNavn:t.butik_navn||"",pris,note,dage:dageTil(til)});
        if(paaSeddel&&!paaSedlen(navn,kort)) tilfoejVare(navn);
        nye++;
      }
      if(flere) return {nye,fandtes};
      fotoBillede="";
      visMine();
      $("fotoStatus").textContent=nye+" tilbud oprettet"+(fandtes?", "+fandtes+" fandtes i forvejen":"")+(paaSeddel&&nye?" og sat på sedlen":"")+".";
      toast(nye+" tilbud oprettet"+(fandtes?" ("+fandtes+" fandtes allerede)":""));
    }catch(e){
      if(flere) return null;
      st.textContent=e.login?"Log ind først.":"Kunne ikke læse teksten"+(String(e.message).includes("409")?" – AI er ikke sat op i Home Assistant":"")+". Billedet er gemt – skriv vare og pris selv.";
    }
  }

  async function visScanner(){

    scanStop=false;
    const st=$("scanStatus"), video=$("scanVideo");
    const fundet=k=>{ if(scanStop) return; stopScan(); try{ navigator.vibrate&&navigator.vibrate(80); }catch(e){} visKode(k); };
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      st.textContent=(window.isSecureContext===false||location.protocol==="http:")
        ?"Kameraet virker kun, når Home Assistant åbnes med https (fx Nabu Casa-adressen) – ikke med http://192.168…. Skriv stregkoden, eller brug en stregkodelæser."
        :"Kameraet kan ikke bruges her. Skriv stregkoden i stedet.";

    try{
      if("BarcodeDetector" in window){
        const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
        scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
        video.srcObject=scanStream; await video.play();
        st.textContent="Hold stregkoden i rammen.";
        const loop=async()=>{ if(scanStop) return;
          try{ const r=await det.detect(video); if(r&&r.length&&r[0].rawValue) return fundet(r[0].rawValue); }catch(e){}
          setTimeout(loop,180); };
        loop(); return;
      }
      const ZX=await hentZxing();
      zxReader=new ZX.BrowserMultiFormatReader();
      st.textContent="Hold stregkoden i rammen.";
      await zxReader.decodeFromConstraints({video:{facingMode:"environment"},audio:false},video,(res)=>{ if(res&&res.getText) fundet(res.getText()); });
      scanStream=video.srcObject;
    }catch(e){
      st.textContent=(e&&e.name==="NotAllowedError")?"Kameraet er ikke tilladt. Giv appen adgang til kameraet, eller skriv stregkoden.":"Kameraet kunne ikke starte. Skriv stregkoden i stedet.";
      // Inde i et Home Assistant-dashboard kan rammen blokere kameraet – tilbyd at åbne appen direkte
      if(inFrame){ const b=document.createElement("button"); b.className="btn primary"; b.style.marginTop="8px"; b.textContent="Åbn scanneren direkte";
        b.onclick=()=>{ try{ window.top.location.href=location.pathname+"?scan=1"; }catch(x){ location.href=location.pathname+"?scan=1"; } }; st.after(b); }
    }
  }
  $("scanBtn").onclick=visScanner;

  async function slaaOp(kode){
    try{
      const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(kode)+".json?fields=product_name,product_name_da,generic_name_da,brands,quantity,image_front_small_url");
      if(!r.ok) return null; const j=await r.json(); if(!j||j.status!==1||!j.product) return null;
      const p=j.product; const navn=(p.product_name_da||p.product_name||p.generic_name_da||"").trim();
      if(!navn) return null;
      const maerke=String(p.brands||"").split(",")[0].trim();
      return {navn:(maerke&&!navn.toLowerCase().includes(maerke.toLowerCase())?maerke+" ":"")+navn+(p.quantity?" "+p.quantity:""), billede:p.image_front_small_url||""};
    }catch(e){ return null; }
  }
  async function visKode(kode){
    const kendt=get("k-"+kode);
    let navn=kendt?kendt.navn:"", billede=kendt?(kendt.billede||""):"", kilde=kendt?"kendt":"";
    const tegn=()=>{
      const iFryser=alle("frys").filter(f=>(f.antal||0)>0&&(f.kode===kode||(navn&&norm(f.navn)===norm(navn))));
      const sk=skuffer(); const valgt=(kendt&&kendt.skuffe&&get(kendt.skuffe))?kendt.skuffe:(localStorage.getItem("hs_sidsteSkuffe")||(sk[0]&&sk[0].id)||"");
      aabenArk('<h2>'+(navn?esc(navn):"Ukendt vare")+'</h2>'+
        '<div class="vareinfo">'+(billede?'<img src="'+esc(billede)+'" alt="">':'')+'<div class="muted">Stregkode '+esc(kode)+(kilde==="off"?" · fundet i Open Food Facts":kilde==="kendt"?" · kendt vare":kilde==="ingen"?" · ikke fundet – skriv navnet":"")+'</div></div>'+
        '<label class="felt">Navn<input type="text" id="kNavn" value="'+esc(navn)+'" placeholder="Hvad er det?" list="forslag"></label>'+
        (iFryser.length?'<div class="card"><h2 style="font-size:16px">I fryseren</h2>'+iFryser.map(f=>{ const s=get(f.skuffe);
          return '<div class="fvare"><div class="navn">'+esc(f.navn)+'<div class="muted">'+esc(tal(f.antal))+" "+esc(flertal(f.enhed,f.antal))+(s?" · "+esc(s.navn):"")+'</div></div><button class="btn small" data-tagud="'+esc(f.id)+'">Tag én ud</button></div>'; }).join("")+'</div>':'')+
        '<div class="card"><h2 style="font-size:16px">Læg i fryseren</h2>'+
        '<div class="row"><label class="felt" style="width:90px">Antal<input type="number" id="kAntal" value="'+((kendt&&kendt.antal)||1)+'" min="0" step="any" inputmode="decimal"></label>'+
        '<label class="felt grow">Enhed<select id="kEnhed">'+enhedValg((kendt&&kendt.enhed)||"stk")+'</select></label>'+
        '<label class="felt grow">Kurv<select id="kSkuffe">'+sk.map(x=>'<option value="'+esc(x.id)+'"'+(x.id===valgt?" selected":"")+'>'+esc(x.navn)+'</option>').join("")+'</select></label></div>'+
        '<div class="knapper"><button class="btn primary" id="kLaegI">Læg i</button></div></div>'+
        '<div class="knapper"><button class="btn" id="kSeddel">Sæt på sedlen</button><button class="btn" id="kScanIgen">Læg i og scan en til</button><button class="btn" id="lukA">Luk</button></div>');
      $("lukA").onclick=lukArk; $("skygge").onclick=lukArk;
      const husk=extra=>{ const n=$("kNavn").value.trim(); if(!n) return null; navn=n;
        const r=Object.assign(get("k-"+kode)||{id:"k-"+kode,kind:"kode"},{navn:n,billede:billede||""},extra||{}); put(r); return n; };
      const laegI=()=>{
        const n=husk(); if(!n){ toast("Skriv hvad varen er"); $("kNavn").focus(); return false; }
        const antal=parseFloat(String($("kAntal").value).replace(",","."))||1, enhed=$("kEnhed").value||"stk", sk2=$("kSkuffe").value;
        husk({enhed,skuffe:sk2,antal}); try{ localStorage.setItem("hs_sidsteSkuffe",sk2); }catch(e){}
        laer("frys",n,{enhed,antal,skuffe:sk2});
        const findes=alle("frys").find(f=>f.skuffe===sk2&&(f.kode===kode||norm(f.navn)===norm(n))&&(f.enhed||"stk")===enhed);
        if(findes){ findes.antal=(findes.antal||0)+antal; findes.lagtInd=Date.now(); findes.kode=kode; put(findes); }
        else put({id:newId("f"),kind:"frys",navn:n,antal,enhed,skuffe:sk2,kode,lagtInd:Date.now()});
        toast(n+" lagt i fryseren"); return true;
      };
      $("kLaegI").onclick=()=>{ if(laegI()) lukArk(); };
      document.querySelectorAll("[data-tagud]").forEach(b=>b.onclick=()=>{ husk(); const f=get(b.dataset.tagud); if(f&&!f.kode){ f.kode=kode; put(f); } aendr(b.dataset.tagud,-1); lukArk(); });
      $("kSeddel").onclick=()=>{ const n=husk(); if(!n){ toast("Skriv hvad varen er"); return; } tilfoejVare(n); lukArk(); toast(n+" sat på sedlen"); };
      $("kScanIgen").onclick=()=>{ if(laegI()) visScanner(); };
    };
    if(!kendt){ navn=""; kilde=""; aabenArk('<h2>Slår stregkoden op …</h2><p class="muted">'+esc(kode)+'</p>');
      const off=await slaaOp(kode); if(off){ navn=off.navn; billede=off.billede; kilde="off"; } else kilde="ingen"; }
    tegn();
    if(!navn) setTimeout(()=>{ const i=$("kNavn"); if(i) i.focus(); },100);
  }

  // USB/Bluetooth-stregkodelæsere virker som et tastatur: mange cifre meget hurtigt efterfulgt af Enter.
  (function(){
    let buf="", sidst=0;
    document.addEventListener("keydown",e=>{
      const nu=Date.now();
      if(/^[0-9]$/.test(e.key)){ buf=(nu-sidst<60)?buf+e.key:e.key; sidst=nu; return; }
      if(e.key==="Enter"&&buf.length>=8&&nu-sidst<100){
        const kode=buf; buf="";
        const el=document.activeElement;
        if(el&&"value" in el&&typeof el.value==="string"&&el.value.endsWith(kode)){ el.value=el.value.slice(0,-kode.length); el.blur(); }
        e.preventDefault(); e.stopPropagation(); stopScan(); visKode(kode); return;
      }
      if(e.key!=="Shift") buf="";
    },true);
  })();

  // ---------- start ----------
  visFane(fane); render();
  (async()=>{
    await handleLoginReturn();
    await sync();
    if(HA && !skuffer().length && localStorage.getItem("hs_importeret")!=="1" && syncState.status==="ok") await importer(false);
    hentTilbud();
    if(HA) hentNavneTilFjernede();
    if(new URLSearchParams(location.search).get("scan")==="1"){ history.replaceState(null,"",location.pathname); visFane("fryser"); visScanner(); }
    await hentMig(); if(ADMIN) rydGamleMine();
  })();
  // ---------- opdatering klar ----------
  const APPVER="0.8.7";
  async function tjekOpdatering(){
    try{ const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return;
      const v=(await r.json()).v; if(v&&v!==APPVER) $("opdBanner").classList.remove("hidden"); }catch(e){}
  }
  $("opdBanner").onclick=async()=>{
    $("opdBanner").textContent="Opdaterer …";
    try{ if(window.caches){ const k=await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); } }catch(e){}
    try{ if(navigator.serviceWorker){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.update().catch(()=>{}))); } }catch(e){}
    location.reload();
  };
  setTimeout(tjekOpdatering,5000); setInterval(tjekOpdatering,10*60*1000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tjekOpdatering(); });
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")&&HA){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
